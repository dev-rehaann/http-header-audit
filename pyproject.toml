[project]
name = "http-header-audit"
version = "0.1.0"
description = "Grade a website's HTTP security headers"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28", "rich>=14.0"]

[project.scripts]
headers = "http_headers_scanner:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["http_headers_scanner"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.22"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
